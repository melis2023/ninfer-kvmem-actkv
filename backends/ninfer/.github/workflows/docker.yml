# Package both verified Linux archives from the same Native release run; no compilation.
name: Container image

# Called as a job after the entire Linux matrix succeeds. The parent owns cancellation.
on:
  workflow_call:
    inputs:
      publish:
        description: Push both images and update the current master tags
        type: boolean
        default: false

jobs:
  package:
    name: Package CUDA ${{ matrix.cuda }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.9'
            toolkit: '12.9.2'
          - cuda: '13.4'
            toolkit: '13.4.3'
    env:
      SHA: ${{ github.sha }}
      CUDA_VARIANT: ${{ matrix.cuda }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-cuda-${{ matrix.toolkit }}
          path: native-artifact
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify and extract the Docker context
        id: extract
        run: echo "context=$(python3.11 .github/scripts/extract-native-image.py native-artifact native-context "$SHA" "$CUDA_VARIANT")" >> "$GITHUB_OUTPUT"
      - name: Commit tag
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:cuda${CUDA_VARIANT}-${SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ steps.extract.outputs.context }}
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          tags: ${{ steps.tags.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.description=NInfer CUDA ${{ matrix.cuda }} with every supported NInfer architecture for this Toolkit
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:cuda${{ matrix.cuda }}
          cache-to: type=inline

  promote:
    name: Update both CUDA tags
    needs: package
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote only the current master commit
        run: .github/scripts/promote-container-images.sh
